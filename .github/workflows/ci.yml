# CI proprio, com os steps inline -- e a excecao da stack.
#
# Os outros 7 repos chamam o go-ci.yml reutilizavel do chameleon-devops. Este
# nao pode: o devops e PRIVADO, e o GitHub so empresta actions e reusable
# workflows de um repo privado para outros repos PRIVADOS. Este repo e publico
# (precisa ser, para o `go mod download` dos demais resolver sem token), entao
# a chamada seria bloqueada.
#
# Consequencia: os steps abaixo duplicam o go-ci.yml de proposito. Mudanca na
# receita de CI precisa ser refletida nos dois lugares.
name: CI

on:
  # So em PR: a master e protegida e o CI e o portao de entrada dela.
  pull_request:
  # Permite rodar pelo botao da aba Actions, sem PR aberta. Nao enfraquece o
  # portao -- e um gatilho a mais, nao um substituto do pull_request.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1
          args: --timeout=5m --max-issues-per-linter=0 --max-same-issues=0

      # gofmt -l lista os arquivos fora do formato mas sai com codigo 0 mesmo
      # assim -- por isso o teste e no conteudo da saida, nao no exit code.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Arquivos fora do formato do gofmt:"
            echo "$unformatted"
            echo "Corrija com: gofmt -w ."
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: go test
        run: go test -race ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: go build
        run: go build ./...
