# CI com steps inline, em vez de chamar o go-ci.yml do chameleon-devops: este
# repo e publico, e o GitHub so empresta workflow de repo privado para repo
# privado. Enquanto for assim, mudanca na receita vale nos dois lugares.
name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Sem job de docker: e biblioteca, nao tem Dockerfile.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1
          args: --timeout=5m --max-issues-per-linter=0 --max-same-issues=0

      # gofmt -l sai com codigo 0 mesmo achando algo: o teste e na saida.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Arquivos fora do formato do gofmt:"
            echo "$unformatted"
            echo "Corrija com: gofmt -w ."
            exit 1
          fi

      - name: go mod tidy
        run: go mod tidy -diff

  vuln:
    name: Vuln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: go test
        run: go test -race ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: go build
        run: go build ./...
